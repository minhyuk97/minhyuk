        .live::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 rgba(45,127,249,.6);
            animation: livePulse 2s infinite;
        }

            color: inherit;
            cursor: pointer;

        .donate-val {

        .list { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 40px; }                
        .card {

            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            transition: .25s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--accent); }                
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(45,127,249,.12), transparent 60%);
            opacity: 0;
            transition: .35s;
            pointer-events: none;

        .info { padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex-grow: 1; text-align: center; }

        function copyAccount() {
            const account = "02012732362";
            navigator.clipboard.writeText(account).then(() => {
                const el = document.getElementById('accountNum');
                el.innerText = "계좌번호 복사 완료! ✓";
                setTimeout(() => {
                    el.innerText = "02012732362 (복사하기)";
                }, 2000);
            }).catch(err => {
                alert("복사에 실패했습니다.");
            });
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const doc = document.documentElement;
            doc.setAttribute('data-theme', doc.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        });

        function updateList() {
            const query = document.getElementById('search').value.toLowerCase();
            const activeBtn = document.querySelector('.btn.active');
            const filter = activeBtn ? activeBtn.dataset.filter : 'all';
            const list = document.getElementById('productList');
            list.innerHTML = '';                        
            
            allSigs.filter(item => {
                const matchesQuery = item.name.toLowerCase().includes(query);                                
                let matchesFilter = false;
                if (filter === 'all') {
                    matchesFilter = (item.category !== '팬페이지');
                } else {
                    matchesFilter = (item.category === filter);
                }                                
                return matchesQuery && matchesFilter;
            })
            .sort((a, b) => (a.price || 0) - (b.price || 0))
            .forEach(item => {
                const videoIcon = item.hasVideo ? ' 🎬' : '';                                
                if (item.isExternal || item.hasVideo) {
                    const linkUrl = item.url;
                    const priceDisplay = item.price ? `₩${item.price.toLocaleString()} ↗` : (item.priceText || "YouTube ↗");
                    list.innerHTML += `
                    <a href="${linkUrl}" target="_blank" rel="noopener noreferrer" class="card">
                        <div class="info">
                            <div class="name">${item.name}<span class="video-tag">${videoIcon}</span></div>
                            <div class="price">${priceDisplay}</div>
                        </div>
                    </a>`;
                } else {
                    list.innerHTML += `
                    <div class="card">
                        <div class="info">
                            <div class="name">${item.name}</div>
                            <div class="price">₩${item.price.toLocaleString()}</div>
                        </div>
                    </div>`;
                }
            });
        }

        document.querySelectorAll('.btn').forEach(btn => btn.addEventListener('click', (e) => {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            updateList();
        }));

        document.getElementById('search').addEventListener('input', updateList);
        updateList();
